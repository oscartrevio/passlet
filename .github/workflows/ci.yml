name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# Keeps lefthook's commit-msg hook from running commitlint on the changesets
# bot's "Version Packages" commit, which would fail the release.
env:
  LEFTHOOK: "0"

jobs:
  check:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm check

      - name: Type check
        run: pnpm check-types

  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      # One failing Node version shouldn't hide results from the others.
      fail-fast: false
      # The two floors from `engines`, then current releases.
      matrix:
        node: ["20.19", "22.12", 24, 26]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # passlet, its workspace dependencies and the root; skips the site.
      - run: pnpm install --frozen-lockfile --filter passlet...

      - name: Test
        run: pnpm -F passlet test

      # ESM-only build: CommonJS apps load it with require(esm), unflagged
      # from the `engines` floors on. Fails on a top-level await or a missed floor.
      - name: require() the build
        working-directory: packages/passlet
        run: |
          pnpm build
          node -e "if (typeof require('./dist/index.js').Wallet !== 'function') process.exit(1)"

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile --filter passlet...

      - name: Build
        run: pnpm -F passlet build

      - name: Check bundle size
        run: pnpm -F passlet check-size

      # attw's --pack only runs npm pack, so check the tarball pnpm publishes:
      # https://github.com/arethetypeswrong/arethetypeswrong.github.io/tree/main/packages/cli#pack
      - name: Pack
        working-directory: packages/passlet
        run: pnpm pack --out "$RUNNER_TEMP/passlet.tgz"

      - name: Lint package
        run: pnpm dlx publint --strict "$RUNNER_TEMP/passlet.tgz"

      # ESM only: CommonJS consumers load it through require(esm), which attw's
      # node16-cjs check doesn't model.
      - name: Check published types
        run: pnpm dlx @arethetypeswrong/cli --profile esm-only "$RUNNER_TEMP/passlet.tgz"

      - uses: actions/upload-artifact@v7
        with:
          name: passlet-tgz
          path: ${{ runner.temp }}/passlet.tgz
          if-no-files-found: error

  examples:
    name: Example (${{ matrix.example }})
    needs: package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [express, hono, nextjs]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/download-artifact@v8
        with:
          name: passlet-tgz
          path: ${{ runner.temp }}

      # The examples depend on passlet from npm; type-check them against this
      # commit's tarball instead, without touching their package.json.
      - name: Install
        working-directory: examples/${{ matrix.example }}
        run: npm install --no-save --no-package-lock --no-audit --no-fund "$RUNNER_TEMP/passlet.tgz"

      - name: Type check
        working-directory: examples/${{ matrix.example }}
        run: npx tsc --noEmit

