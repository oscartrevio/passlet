name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

# Git hooks are local-dev ergonomics; CI runs its checks as explicit steps.
# Without this, lefthook's commit-msg hook runs commitlint on the changesets
# bot's "Version Packages" commit and fails the release.
env:
  LEFTHOOK: "0"

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      # Node 24 ships npm 11, which npm trusted publishing (OIDC) needs.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm -F passlet test

      - name: Create Release PR or Publish
        uses: changesets/action@v2
        with:
          version-script: pnpm changeset version
          publish-script: pnpm release
