name: Feature request
description: Suggest an addition or change to passlet
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that passlet makes hard or impossible?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: The API or behavior you would like. A code sketch helps.
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options:
        - Apple
        - Google
        - Both
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
